[package]
name = "just-next"
version = "0.1.0"
edition = "2021"
description = "A modern reimplementation of the just command runner"
license = "MIT"

[[bin]]
name = "just-next"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
miette = { version = "7", features = ["fancy"] }
thiserror = "1.0"
which = "7"
